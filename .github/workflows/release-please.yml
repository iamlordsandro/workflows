name: Release Please

on:
  workflow_call:
    inputs:
      mode:
        description: Run preparation, publication, or both (prepare, publish, both).
        type: string
        default: both
      target_branch:
        description: Protected branch for release pull requests.
        type: string
        default: main
      config_file:
        description: Path to Release Please configuration in the caller.
        type: string
        default: release-please-config.json
      manifest_file:
        description: Path to the Release Please manifest in the caller.
        type: string
        default: .release-please-manifest.json
      package_path:
        description: Package path for the release outputs.
        type: string
        default: '.'
      auto_merge:
        description: Enable squash auto-merge on generated release PRs after required checks pass.
        type: boolean
        default: false
    secrets:
      release_token:
        description: Repository-scoped GitHub App or PAT for release writes and PR CI.
        required: true
    outputs:
      release_created:
        description: Whether Release Please created a release for package_path.
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: Tag for the created release.
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: Version for the created release.
        value: ${{ jobs.release.outputs.version }}
      sha:
        description: Commit tagged by Release Please.
        value: ${{ jobs.release.outputs.sha }}

permissions:
  contents: read

jobs:
  release:
    name: Run Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.outputs.outputs.release_created }}
      tag_name: ${{ steps.outputs.outputs.tag_name }}
      version: ${{ steps.outputs.outputs.version }}
      sha: ${{ steps.outputs.outputs.sha }}
    steps:
      - name: Validate the Release Call
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$TARGET_BRANCH" ]] ||
             [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::Run Release Please from the protected target branch."
            exit 1
          fi
          case "$MODE" in
            prepare|publish|both) ;;
            *) echo "::error::Set mode to prepare, publish, or both."; exit 1 ;;
          esac
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Configure a repository-scoped release token before running Release Please."
            exit 1
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.release_token }}
          target-branch: ${{ inputs.target_branch }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}
          skip-github-release: ${{ inputs.mode == 'prepare' }}
          skip-github-pull-request: ${{ inputs.mode == 'publish' }}

      - name: Enable Auto-Merge for Generated Release PRs
        if: inputs.auto_merge && inputs.mode != 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.release_token }}
          RELEASE_PULL_REQUESTS: ${{ steps.release.outputs.prs }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CONFIG_FILE: ${{ inputs.config_file }}
          MANIFEST_FILE: ${{ inputs.manifest_file }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process');
          const { GITHUB_REPOSITORY: repository, TARGET_BRANCH: branch } = process.env;
          const configFile = process.env.CONFIG_FILE || 'release-please-config.json';
          const manifestFile = process.env.MANIFEST_FILE || '.release-please-manifest.json';
          const branchPrefix = 'release-please--branches--' + branch;
          const reported = JSON.parse(process.env.RELEASE_PULL_REQUESTS || '[]');
          const validNumber = (number) => Number.isSafeInteger(number) && number > 0;
          if (!Array.isArray(reported) || reported.some((pull) => !validNumber(pull?.number) ||
              pull.baseBranchName !== branch || typeof pull.headBranchName !== 'string')) {
            throw new Error('Release Please returned invalid pull request metadata.');
          }
          const reportedHeads = new Map(reported.map((pull) => [pull.number, pull.headBranchName]));
          const gh = (...args) => JSON.parse(execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 }));
          const endpoint = 'repos/' + repository;
          const pulls = gh('api', '--paginate', '--slurp', '--method', 'GET', endpoint + '/pulls',
            '-f', 'state=open', '-f', 'base=' + branch, '-f', 'per_page=100').flat();
          const candidates = pulls.filter((pull) => {
            const head = pull.head.ref;
            return pull.state === 'open' && !pull.draft && pull.base.ref === branch &&
              pull.head.repo?.id === pull.base.repo.id &&
              (reportedHeads.get(pull.number) === head || head === branchPrefix ||
                ['--components--', '--groups--'].some((suffix) => head.startsWith(branchPrefix + suffix) &&
                  head.length > branchPrefix.length + suffix.length));
          });
          if (!candidates.length) process.exit(0);

          const { data: { viewer } } = gh('api', 'graphql', '-f', 'query=query { viewer { login } }');
          if (!viewer?.login) throw new Error('Could not identify the release token owner.');
          const owned = candidates.filter((pull) => pull.user?.login === viewer.login);
          if (candidates.some((pull) => reportedHeads.has(pull.number) &&
              (reportedHeads.get(pull.number) !== pull.head.ref || pull.user?.login !== viewer.login))) {
            throw new Error('A reported release pull request has an unexpected head or author.');
          }

          let pendingLabels;
          for (const pull of owned) {
            if (!validNumber(pull.number)) throw new Error('GitHub returned an invalid pull request number.');
            const number = String(pull.number);
            if (!reportedHeads.has(pull.number)) {
              // Release Please omits open pull requests whose release notes did not change.
              if (!pendingLabels) {
                const path = configFile.split('/').map(encodeURIComponent).join('/');
                const { content } = gh('api', '--method', 'GET', endpoint + '/contents/' + path, '-f', 'ref=' + branch);
                const config = JSON.parse(Buffer.from(content, 'base64').toString('utf8'));
                pendingLabels = (config.label ?? 'autorelease: pending').split(',');
              }
              if (!pendingLabels.every((name) => name && pull.labels.some((label) => label.name === name))) continue;
              const files = gh('api', '--paginate', '--slurp', endpoint + '/pulls/' + number + '/files?per_page=100').flat();
              if (!files.some((file) => file.filename === manifestFile && file.status === 'modified')) {
                throw new Error('Could not verify the release manifest change for pull request #' + number + '.');
              }
            }
            const live = gh('pr', 'view', number, '--repo', repository,
              '--json', 'state,isDraft,baseRefName,headRefOid,autoMergeRequest');
            if (live.state !== 'OPEN' || live.isDraft || live.autoMergeRequest?.mergeMethod === 'SQUASH') continue;
            if (live.baseRefName !== branch || live.headRefOid !== pull.head.sha || !/^[a-f0-9]{40}$/.test(live.headRefOid)) {
              throw new Error('The release pull request changed during verification. Retry against its current head.');
            }
            execFileSync('gh', ['pr', 'merge', number, '--repo', repository, '--auto', '--squash',
              '--match-head-commit', live.headRefOid], { stdio: 'inherit' });
          }
          JS

      - name: Return the Selected Package Outputs
        id: outputs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        with:
          script: |
            const outputs = JSON.parse(process.env.RELEASE_OUTPUTS);
            const prefix = process.env.PACKAGE_PATH === '.' ? '' : process.env.PACKAGE_PATH + '--';
            const created = outputs[prefix + 'release_created'] === 'true';
            core.setOutput('release_created', String(created));
            for (const key of ['tag_name', 'version', 'sha']) {
              core.setOutput(key, created ? outputs[prefix + key] || '' : '');
            }

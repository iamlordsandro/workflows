name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Workflow Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the Scripts Embedded in the Reusable Workflows
        run: node --test tests/*.test.cjs
  quality:
    uses: ./.github/workflows/workflow-quality.yml

  release:
    name: Release the Workflow Library
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, quality]
    concurrency:
      group: workflows-release-main
      cancel-in-progress: false
    uses: ./.github/workflows/release-please.yml
    with:
      auto_merge: true
    secrets:
      release_token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
